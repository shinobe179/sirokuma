[project]
name = "sirokuma"
version = "0.1.0"
description = "tag-based log polling library"
readme = "README.md"
authors = [
    { name = "shinobe179", email = "befs.anne@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.37.30",
    "mypy>=1.15.0",
    "pydantic>=2.11.2",
    "requests>=2.32.3",
    "uuid6>=2024.7.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
